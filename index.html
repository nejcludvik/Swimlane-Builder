<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimlane Diagram Builder</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --stage-width: 300px;
            --lane-height: 200px;
            --header-height: 60px;
            --sidebar-width: 150px;
        }
        
        body { margin: 0; overflow: hidden; }

        .diagram-container {
            position: relative;
            background: white;
            min-width: max-content;
            min-height: max-content;
            padding-bottom: 50px;
            padding-right: 50px;
        }

        .stages-header {
            display: flex;
            margin-left: var(--sidebar-width);
        }

        .stage-title {
            width: var(--stage-width);
            height: var(--header-height);
            border: 1px solid #cbd5e1;
            background-color: #0f766e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-align: center;
            min-width: var(--stage-width);
            position: relative;
        }

        .lane-container {
            display: flex;
            border-bottom: 1px solid #cbd5e1;
        }

        .lane-title {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: var(--lane-height);
            background-color: #1e293b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            text-align: center;
            position: relative;
        }

        .editable-text {
            width: 100%;
            padding: 0.5rem;
            outline: none;
            box-sizing: border-box;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .lane-cells {
            display: flex;
        }

        .lane-cell {
            width: var(--stage-width);
            min-width: var(--stage-width);
            height: var(--lane-height);
            border-right: 1px solid #cbd5e1;
            background-color: #f8fafc;
        }
        
        .lane-container:nth-child(even) .lane-cell {
            background-color: #f1f5f9;
        }

        /* Shape Base Styling */
        .shape {
            position: absolute;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            user-select: none;
            outline: none;
            min-height: 60px;
            min-width: 120px;
            font-size: 14px;
            z-index: 10;
            box-sizing: border-box;
        }

        /* Process Shape: Soft Sky Blue Fill + Slate Dark Border */
        .shape.process {
            border: 2px solid #1e293b;
            background: #f0f9ff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            color: #0f172a;
        }

        /* Decision Shape: SVG Diamond with Exact Matching Outline + Shadow */
        .shape.decision {
            width: 140px;
            height: 100px;
            padding: 1.25rem;
            background: transparent;
            border: none;
            box-shadow: none;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            color: #0f172a;
        }

        .decision-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Free Text Label Style */
        .shape.text-label {
            min-height: 28px;
            min-width: 40px;
            padding: 2px 6px;
            background: transparent;
            border: 1px dashed transparent;
            box-shadow: none;
            color: #1e293b;
            font-weight: 600;
            font-size: 13px;
            z-index: 15;
        }

        .shape.text-label:hover {
            border-color: #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
        }

        /* Centered Shape Content Wrapper (Non-flex to allow proper multiline rendering on Enter) */
        .shape-content {
            position: relative;
            z-index: 2;
            outline: none;
            width: 100%;
            text-align: center;
            line-height: 1.25;
            word-break: break-word;
            white-space: pre-wrap;
            margin: 0;
            padding: 0;
        }

        /* Selected State */
        .shape.selected {
            outline: 2px solid #2563eb !important;
            outline-offset: 3px;
        }

        /* Connection Ports */
        .port {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #3b82f6;
            border: 2px solid white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            cursor: crosshair;
            z-index: 25;
        }

        .shape:hover .port,
        .port.hovered {
            opacity: 1;
        }

        .port:hover {
            transform: scale(1.3);
            background-color: #2563eb;
        }

        .port.top { top: -6px; left: calc(50% - 6px); }
        .port.right { top: calc(50% - 6px); right: -6px; }
        .port.bottom { bottom: -6px; left: calc(50% - 6px); }
        .port.left { top: calc(50% - 6px); left: -6px; }

        .shape.target-hover {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4) !important;
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
        }

        .delete-grid-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            border: 2px solid white;
        }

        .shape:hover .delete-btn,
        .stage-title:hover .delete-grid-btn,
        .lane-title:hover .delete-grid-btn {
            display: flex;
        }

        #arrows-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Toolbar -->
    <div class="bg-white border-b shadow-sm p-3 flex flex-wrap gap-3 items-center z-20 shrink-0" data-html2canvas-ignore="true">
        <h1 class="text-lg font-bold text-gray-800 mr-2">Diagram Builder</h1>
        
        <!-- Save & Open Controls -->
        <div class="flex gap-2 border-r pr-3">
            <button onclick="saveDiagram()" title="Save Diagram to File" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded border border-emerald-200 text-sm font-medium transition-colors flex items-center gap-1">
                💾 Save
            </button>
            <button onclick="document.getElementById('file-input').click()" title="Open Diagram from File" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded border border-amber-200 text-sm font-medium transition-colors flex items-center gap-1">
                📂 Open
            </button>
            <input type="file" id="file-input" accept=".json" class="hidden" onchange="loadDiagram(event)">
        </div>

        <!-- Add Shapes & Free Text -->
        <div class="flex gap-2 border-r pr-3">
            <button onclick="addShape('process')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded border border-blue-200 text-sm font-medium transition-colors">
                + Process
            </button>
            <button onclick="addShape('decision')" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded border border-amber-200 text-sm font-medium transition-colors">
                + Decision
            </button>
            <button onclick="addShape('text')" title="Add YES / NO or Annotation Text" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded border border-gray-300 text-sm font-semibold transition-colors">
                + Text Label
            </button>
        </div>

        <!-- Alignment Controls -->
        <div class="flex gap-1 border-r pr-3 items-center">
            <span class="text-xs font-semibold text-gray-500 mr-1">Align:</span>
            <button onclick="alignShapes('left')" title="Align Left" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                ← Left
            </button>
            <button onclick="alignShapes('center-h')" title="Align Center (Vertically)" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                ↔ Center
            </button>
            <button onclick="alignShapes('right')" title="Align Right" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                Right →
            </button>
            <button onclick="alignShapes('top')" title="Align Top" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                ↑ Top
            </button>
            <button onclick="alignShapes('middle-v')" title="Align Middle (Horizontally)" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                ↕ Middle
            </button>
            <button onclick="alignShapes('bottom')" title="Align Bottom" class="p-1.5 bg-gray-50 hover:bg-gray-200 border text-gray-700 rounded text-xs font-semibold">
                ↓ Bottom
            </button>
        </div>

        <!-- Add Grid Lanes -->
        <div class="flex gap-2 border-r pr-3">
            <button onclick="addStage()" class="px-3 py-1.5 bg-teal-50 hover:bg-teal-100 text-teal-700 rounded border border-teal-200 text-sm font-medium transition-colors">
                + Stage
            </button>
            <button onclick="addLane()" class="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded border border-slate-200 text-sm font-medium transition-colors">
                + Lane
            </button>
        </div>

        <!-- Resize Controls -->
        <div class="flex gap-2 border-r pr-3">
            <label class="text-xs text-gray-600 flex items-center gap-1 font-medium">
                Col: 
                <input type="number" id="colWidth" value="300" step="10" min="150" max="800" class="w-14 border rounded px-1 py-1 text-black font-normal text-xs" onchange="updateGridSize()" onkeyup="updateGridSize()">
            </label>
            <label class="text-xs text-gray-600 flex items-center gap-1 font-medium">
                Row: 
                <input type="number" id="rowHeight" value="200" step="10" min="100" max="800" class="w-14 border rounded px-1 py-1 text-black font-normal text-xs" onchange="updateGridSize()" onkeyup="updateGridSize()">
            </label>
        </div>

        <!-- Export -->
        <button onclick="exportPNG()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-sm font-medium transition-colors ml-auto flex items-center gap-2">
            Export PNG
        </button>
    </div>

    <!-- Scrollable Canvas Area -->
    <div class="flex-1 overflow-auto p-8 relative" id="scroll-container" onclick="handleCanvasClick(event)">
        
        <!-- Diagram Wrapper -->
        <div id="diagram-wrapper" class="diagram-container inline-block">
            
            <div id="stages-header" class="stages-header"></div>
            
            <div id="lanes-wrapper"></div>

            <div id="shapes-container" class="absolute top-0 left-0 w-full h-full" style="margin-top: var(--header-height); margin-left: var(--sidebar-width);">
                <!-- SVG for Drawing Orthogonal Arrows and Guide Lines -->
                <svg id="arrows-svg">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
                        </marker>
                        <marker id="arrowhead-temp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
                        </marker>
                    </defs>
                    <g id="guides-group"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        let stageCount = 0;
        let laneCount = 0;
        let shapeCount = 0;
        let zIndexCounter = 100;
        
        let connections = [];
        let isConnecting = false;
        let connectionStartShapeId = null;
        let connectionStartPort = null;

        window.onload = () => {
            addStage('Stage 1: Project Initiation');
            addStage('Stage 2: Development');
            addStage('Stage 3: Verification');
            
            addLane('Product Manager');
            addLane('Head of Development');
            addLane('HW Dev Team Lead');
            addLane('Embedded Sys Developer');
        };

        // 1. Save & Load Functions
        function saveDiagram() {
            const colWidth = document.getElementById('colWidth').value;
            const rowHeight = document.getElementById('rowHeight').value;

            const stages = [];
            document.querySelectorAll('#stages-header .stage-title').forEach(el => {
                stages.push(el.querySelector('.editable-text').innerText);
            });

            const lanes = [];
            document.querySelectorAll('#lanes-wrapper .lane-title').forEach(el => {
                lanes.push(el.querySelector('.editable-text').innerText);
            });

            const shapes = [];
            document.querySelectorAll('.shape').forEach(el => {
                let shapeType = 'process';
                if (el.classList.contains('decision')) shapeType = 'decision';
                else if (el.classList.contains('text-label')) shapeType = 'text';

                shapes.push({
                    id: el.id,
                    type: shapeType,
                    left: el.style.left,
                    top: el.style.top,
                    zIndex: el.style.zIndex,
                    text: el.querySelector('.shape-content').innerText
                });
            });

            const diagramData = {
                colWidth,
                rowHeight,
                stages,
                lanes,
                shapes,
                connections
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(diagramData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "diagram.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadDiagram(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    restoreDiagramState(data);
                } catch (err) {
                    alert('Invalid diagram file format.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function restoreDiagramState(data) {
            document.getElementById('stages-header').innerHTML = '';
            document.getElementById('lanes-wrapper').innerHTML = '';
            document.querySelectorAll('.shape').forEach(s => s.remove());
            connections = [];

            if (data.colWidth) document.getElementById('colWidth').value = data.colWidth;
            if (data.rowHeight) document.getElementById('rowHeight').value = data.rowHeight;
            updateGridSize();

            stageCount = 0;
            if (data.stages) data.stages.forEach(s => addStage(s));

            laneCount = 0;
            if (data.lanes) data.lanes.forEach(l => addLane(l));

            shapeCount = 0;
            let maxIdNum = 0;
            let maxZ = 100;

            if (data.shapes) {
                data.shapes.forEach(sData => {
                    const num = parseInt(sData.id.replace('shape-', '')) || 0;
                    if (num > maxIdNum) maxIdNum = num;
                    const z = parseInt(sData.zIndex) || 100;
                    if (z > maxZ) maxZ = z;

                    addShapeWithData(sData);
                });
            }

            shapeCount = maxIdNum;
            zIndexCounter = maxZ + 1;

            if (data.connections && Array.isArray(data.connections)) {
                connections = data.connections;
            }

            drawArrows();
        }

        function addShapeWithData(sData) {
            const container = document.getElementById('shapes-container');
            const shapeId = sData.id;
            
            const shape = document.createElement('div');
            shape.className = `shape ${sData.type === 'text' ? 'text-label' : sData.type}`;
            shape.style.left = sData.left || '40px';
            shape.style.top = sData.top || '40px';
            shape.style.zIndex = sData.zIndex || 100;
            shape.id = shapeId;

            if (sData.type === 'decision') {
                const svgNS = "http://www.w3.org/2000/svg";
                const svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("class", "decision-svg");
                svg.setAttribute("viewBox", "0 0 100 100");
                svg.setAttribute("preserveAspectRatio", "none");

                const polygon = document.createElementNS(svgNS, "polygon");
                polygon.setAttribute("points", "50,2 98,50 50,98 2,50");
                polygon.setAttribute("fill", "#fffbeb");
                polygon.setAttribute("stroke", "#1e293b");
                polygon.setAttribute("stroke-width", "2");

                svg.appendChild(polygon);
                shape.appendChild(svg);
            }

            const textDiv = document.createElement('div');
            textDiv.contentEditable = true;
            textDiv.innerText = sData.text || '';
            textDiv.className = 'shape-content';
            textDiv.onmousedown = (e) => e.stopPropagation();
            textDiv.onkeydown = (e) => e.stopPropagation();

            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.setAttribute('data-html2canvas-ignore', 'true');
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                shape.remove();
                connections = connections.filter(c => c.from !== shapeId && c.to !== shapeId);
                drawArrows();
            };

            if (sData.type !== 'text') {
                const ports = ['top', 'right', 'bottom', 'left'];
                ports.forEach(portPos => {
                    const port = document.createElement('div');
                    port.className = `port ${portPos}`;
                    port.setAttribute('data-html2canvas-ignore', 'true');
                    port.onmousedown = (e) => startConnectionDrag(e, shapeId, portPos);
                    shape.appendChild(port);
                });
            }

            shape.appendChild(deleteBtn);
            shape.appendChild(textDiv);
            container.appendChild(shape);

            makeDraggable(shape);
        }

        // 2. Selection & Alignment Functions
        function handleCanvasClick(e) {
            if (e.target.id === 'scroll-container' || e.target.id === 'diagram-wrapper' || e.target.classList.contains('lane-cell')) {
                clearSelections();
            }
        }

        function clearSelections() {
            document.querySelectorAll('.shape.selected').forEach(s => s.classList.remove('selected'));
        }

        function alignShapes(type) {
            const selected = Array.from(document.querySelectorAll('.shape.selected'));
            if (selected.length < 2) {
                alert('Please select at least 2 shapes (Hold Shift + Click shapes) to align them.');
                return;
            }

            let minLeft = Infinity, maxRight = -Infinity;
            let minTop = Infinity, maxBottom = -Infinity;

            selected.forEach(el => {
                const l = el.offsetLeft;
                const r = el.offsetLeft + el.offsetWidth;
                const t = el.offsetTop;
                const b = el.offsetTop + el.offsetHeight;

                if (l < minLeft) minLeft = l;
                if (r > maxRight) maxRight = r;
                if (t < minTop) minTop = t;
                if (b > maxBottom) maxBottom = b;
            });

            const centerX = minLeft + (maxRight - minLeft) / 2;
            const centerY = minTop + (maxBottom - minTop) / 2;

            selected.forEach(el => {
                if (type === 'left') el.style.left = minLeft + 'px';
                else if (type === 'right') el.style.left = (maxRight - el.offsetWidth) + 'px';
                else if (type === 'center-h') el.style.left = (centerX - el.offsetWidth / 2) + 'px';
                else if (type === 'top') el.style.top = minTop + 'px';
                else if (type === 'bottom') el.style.top = (maxBottom - el.offsetHeight) + 'px';
                else if (type === 'middle-v') el.style.top = (centerY - el.offsetHeight / 2) + 'px';
            });

            drawArrows();
        }

        // 3. Arrow Connection & Dragging Logic
        function startConnectionDrag(e, shapeId, portName) {
            e.stopPropagation();
            e.preventDefault();

            isConnecting = true;
            connectionStartShapeId = shapeId;
            connectionStartPort = portName;

            document.addEventListener('mousemove', handleConnectionMouseMove);
            document.addEventListener('mouseup', handleConnectionMouseUp);
        }

        function handleConnectionMouseMove(e) {
            if (!isConnecting) return;

            const shapesContainer = document.getElementById('shapes-container');
            const containerRect = shapesContainer.getBoundingClientRect();

            const fromEl = document.getElementById(connectionStartShapeId);
            if (!fromEl) return;

            const startX = fromEl.offsetLeft + (fromEl.offsetWidth / 2);
            const startY = fromEl.offsetTop + (fromEl.offsetHeight / 2);

            const currentX = e.clientX - containerRect.left;
            const currentY = e.clientY - containerRect.top;

            drawTempArrow(startX, startY, currentX, currentY);

            const elementUnderCursor = document.elementFromPoint(e.clientX, e.clientY);
            const targetShape = elementUnderCursor ? elementUnderCursor.closest('.shape') : null;

            document.querySelectorAll('.shape').forEach(s => s.classList.remove('target-hover'));
            if (targetShape && targetShape.id !== connectionStartShapeId && !targetShape.classList.contains('text-label')) {
                targetShape.classList.add('target-hover');
            }
        }

        function handleConnectionMouseUp(e) {
            if (!isConnecting) return;

            const elementUnderCursor = document.elementFromPoint(e.clientX, e.clientY);
            const targetShape = elementUnderCursor ? elementUnderCursor.closest('.shape') : null;

            if (targetShape && targetShape.id !== connectionStartShapeId && !targetShape.classList.contains('text-label')) {
                connections.push({ from: connectionStartShapeId, to: targetShape.id });
            }

            isConnecting = false;
            connectionStartShapeId = null;
            connectionStartPort = null;

            document.querySelectorAll('.shape').forEach(s => s.classList.remove('target-hover'));
            removeTempArrow();
            drawArrows();

            document.removeEventListener('mousemove', handleConnectionMouseMove);
            document.removeEventListener('mouseup', handleConnectionMouseUp);
        }

        function drawTempArrow(startX, startY, currentX, currentY) {
            const svg = document.getElementById('arrows-svg');
            let tempPath = document.getElementById('temp-path');

            if (!tempPath) {
                tempPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                tempPath.setAttribute("id", "temp-path");
                tempPath.setAttribute("fill", "none");
                tempPath.setAttribute("stroke", "#3b82f6");
                tempPath.setAttribute("stroke-width", "2");
                tempPath.setAttribute("stroke-dasharray", "5 5");
                tempPath.setAttribute("marker-end", "url(#arrowhead-temp)");
                svg.appendChild(tempPath);
            }

            let pathString = "";
            if (Math.abs(startX - currentX) > Math.abs(startY - currentY)) {
                const midX = (startX + currentX) / 2;
                pathString = `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${currentY} L ${currentX} ${currentY}`;
            } else {
                const midY = (startY + currentY) / 2;
                pathString = `M ${startX} ${startY} L ${startX} ${midY} L ${currentX} ${midY} L ${currentX} ${currentY}`;
            }

            tempPath.setAttribute("d", pathString);
        }

        function removeTempArrow() {
            const tempPath = document.getElementById('temp-path');
            if (tempPath) tempPath.remove();
        }

        function drawArrows() {
            const svg = document.getElementById('arrows-svg');
            const defs = svg.querySelector('defs').outerHTML;
            const guidesGroup = svg.querySelector('#guides-group').outerHTML;
            svg.innerHTML = defs + guidesGroup;

            connections.forEach(conn => {
                const fromEl = document.getElementById(conn.from);
                const toEl = document.getElementById(conn.to);
                
                if (!fromEl || !toEl) return;

                const rectA = {
                    left: fromEl.offsetLeft,
                    top: fromEl.offsetTop,
                    width: fromEl.offsetWidth,
                    height: fromEl.offsetHeight,
                    right: fromEl.offsetLeft + fromEl.offsetWidth,
                    bottom: fromEl.offsetTop + fromEl.offsetHeight,
                    centerX: fromEl.offsetLeft + (fromEl.offsetWidth / 2),
                    centerY: fromEl.offsetTop + (fromEl.offsetHeight / 2)
                };

                const rectB = {
                    left: toEl.offsetLeft,
                    top: toEl.offsetTop,
                    width: toEl.offsetWidth,
                    height: toEl.offsetHeight,
                    right: toEl.offsetLeft + toEl.offsetWidth,
                    bottom: toEl.offsetTop + toEl.offsetHeight,
                    centerX: toEl.offsetLeft + (toEl.offsetWidth / 2),
                    centerY: toEl.offsetTop + (toEl.offsetHeight / 2)
                };

                let startX, startY, endX, endY;
                let pathString = "";

                if (Math.abs(rectA.centerX - rectB.centerX) > Math.abs(rectA.centerY - rectB.centerY)) {
                    if (rectA.centerX < rectB.centerX) {
                        startX = rectA.right;
                        startY = rectA.centerY;
                        endX = rectB.left;
                        endY = rectB.centerY;
                    } else {
                        startX = rectA.left;
                        startY = rectA.centerY;
                        endX = rectB.right;
                        endY = rectB.centerY;
                    }
                    const midX = (startX + endX) / 2;
                    pathString = `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`;
                } else {
                    if (rectA.centerY < rectB.centerY) {
                        startX = rectA.centerX;
                        startY = rectA.bottom;
                        endX = rectB.centerX;
                        endY = rectB.top;
                    } else {
                        startX = rectA.centerX;
                        startY = rectA.top;
                        endX = rectB.centerX;
                        endY = rectB.bottom;
                    }
                    const midY = (startY + endY) / 2;
                    pathString = `M ${startX} ${startY} L ${startX} ${midY} L ${endX} ${midY} L ${endX} ${endY}`;
                }

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathString);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", "#475569");
                path.setAttribute("stroke-width", "2");
                path.setAttribute("stroke-linejoin", "round");
                path.setAttribute("marker-end", "url(#arrowhead)");
                
                svg.appendChild(path);
            });
        }

        // 4. Grid Management
        function updateGridSize() {
            const width = document.getElementById('colWidth').value;
            const height = document.getElementById('rowHeight').value;
            if (width >= 100) document.documentElement.style.setProperty('--stage-width', width + 'px');
            if (height >= 50) document.documentElement.style.setProperty('--lane-height', height + 'px');
            drawArrows();
        }

        function addStage(titleText) {
            stageCount++;
            const text = typeof titleText === 'string' ? titleText : `New Stage ${stageCount}`;
            const header = document.getElementById('stages-header');
            
            const stage = document.createElement('div');
            stage.className = 'stage-title';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'editable-text';
            textDiv.contentEditable = true;
            textDiv.innerText = text;
            textDiv.onmousedown = (e) => e.stopPropagation();
            textDiv.onkeydown = (e) => e.stopPropagation();

            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'delete-grid-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.setAttribute('data-html2canvas-ignore', 'true');
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                const index = Array.from(header.children).indexOf(stage);
                stage.remove();
                const lanes = document.querySelectorAll('.lane-cells');
                lanes.forEach(lane => {
                    if(lane.children[index]) lane.children[index].remove();
                });
                drawArrows(); 
            };

            stage.appendChild(deleteBtn);
            stage.appendChild(textDiv);
            header.appendChild(stage);

            const lanes = document.querySelectorAll('.lane-cells');
            lanes.forEach(lane => {
                const cell = document.createElement('div');
                cell.className = 'lane-cell';
                lane.appendChild(cell);
            });
        }

        function addLane(titleText) {
            laneCount++;
            const text = typeof titleText === 'string' ? titleText : `New Role ${laneCount}`;
            const wrapper = document.getElementById('lanes-wrapper');
            
            const laneContainer = document.createElement('div');
            laneContainer.className = 'lane-container';

            const laneTitle = document.createElement('div');
            laneTitle.className = 'lane-title';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'editable-text';
            textDiv.contentEditable = true;
            textDiv.innerText = text;
            textDiv.onmousedown = (e) => e.stopPropagation();
            textDiv.onkeydown = (e) => e.stopPropagation();

            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'delete-grid-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.setAttribute('data-html2canvas-ignore', 'true');
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                laneContainer.remove();
                drawArrows();
            };

            laneTitle.appendChild(deleteBtn);
            laneTitle.appendChild(textDiv);

            const laneCells = document.createElement('div');
            laneCells.className = 'lane-cells';
            
            const currentColumns = document.getElementById('stages-header').children.length;
            for(let i = 0; i < currentColumns; i++) {
                const cell = document.createElement('div');
                cell.className = 'lane-cell';
                laneCells.appendChild(cell);
            }

            laneContainer.appendChild(laneTitle);
            laneContainer.appendChild(laneCells);
            wrapper.appendChild(laneContainer);
        }

        function addShape(type) {
            shapeCount++;
            let defaultText = 'Process Step';
            if (type === 'decision') defaultText = 'Decision';
            else if (type === 'text') defaultText = 'YES';

            addShapeWithData({
                id: `shape-${shapeCount}`,
                type: type,
                left: '60px',
                top: '60px',
                zIndex: zIndexCounter++,
                text: defaultText
            });
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.addEventListener('mousedown', dragMouseDown);

            function dragMouseDown(e) {
                if (e.target.contentEditable === 'true' || e.target.classList.contains('port') || e.target.classList.contains('delete-btn')) return;
                
                if (e.shiftKey) {
                    element.classList.toggle('selected');
                } else {
                    if (!element.classList.contains('selected')) {
                        clearSelections();
                        element.classList.add('selected');
                    }
                }

                element.style.zIndex = zIndexCounter++;
                pos3 = e.clientX;
                pos4 = e.clientY;

                document.addEventListener('mouseup', closeDragElement);
                document.addEventListener('mousemove', elementDrag);
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                let newTop = element.offsetTop - pos2;
                let newLeft = element.offsetLeft - pos1;

                const SNAP_THRESHOLD = 6;
                const otherShapes = Array.from(document.querySelectorAll('.shape')).filter(s => s.id !== element.id);
                
                let snapX = null;
                let snapY = null;

                const myWidth = element.offsetWidth;
                const myHeight = element.offsetHeight;

                const myPointsX = [
                    { type: 'left', val: newLeft },
                    { type: 'center', val: newLeft + myWidth / 2 },
                    { type: 'right', val: newLeft + myWidth }
                ];

                const myPointsY = [
                    { type: 'top', val: newTop },
                    { type: 'middle', val: newTop + myHeight / 2 },
                    { type: 'bottom', val: newTop + myHeight }
                ];

                otherShapes.forEach(other => {
                    const oL = other.offsetLeft;
                    const oW = other.offsetWidth;
                    const oPointsX = [oL, oL + oW / 2, oL + oW];

                    myPointsX.forEach(m => {
                        oPointsX.forEach(oVal => {
                            if (Math.abs(m.val - oVal) < SNAP_THRESHOLD) {
                                if (m.type === 'left') newLeft = oVal;
                                else if (m.type === 'center') newLeft = oVal - myWidth / 2;
                                else if (m.type === 'right') newLeft = oVal - myWidth;
                                snapX = oVal;
                            }
                        });
                    });
                });

                otherShapes.forEach(other => {
                    const oT = other.offsetTop;
                    const oH = other.offsetHeight;
                    const oPointsY = [oT, oT + oH / 2, oT + oH];

                    myPointsY.forEach(m => {
                        oPointsY.forEach(oVal => {
                            if (Math.abs(m.val - oVal) < SNAP_THRESHOLD) {
                                if (m.type === 'top') newTop = oVal;
                                else if (m.type === 'middle') newTop = oVal - myHeight / 2;
                                else if (m.type === 'bottom') newTop = oVal - myHeight;
                                snapY = oVal;
                            }
                        });
                    });
                });

                element.style.top = newTop + "px";
                element.style.left = newLeft + "px";
                
                renderAlignmentGuides(snapX, snapY);
                drawArrows();
            }

            function closeDragElement() {
                clearAlignmentGuides();
                document.removeEventListener('mouseup', closeDragElement);
                document.removeEventListener('mousemove', elementDrag);
            }
        }

        function renderAlignmentGuides(x, y) {
            const group = document.getElementById('guides-group');
            group.innerHTML = '';

            if (x !== null) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x);
                line.setAttribute("y1", "0");
                line.setAttribute("x2", x);
                line.setAttribute("y2", "2000");
                line.setAttribute("stroke", "#ec4899");
                line.setAttribute("stroke-width", "1.5");
                line.setAttribute("stroke-dasharray", "4 4");
                group.appendChild(line);
            }

            if (y !== null) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", "0");
                line.setAttribute("y1", y);
                line.setAttribute("x2", "2000");
                line.setAttribute("y2", y);
                line.setAttribute("stroke", "#ec4899");
                line.setAttribute("stroke-width", "1.5");
                line.setAttribute("stroke-dasharray", "4 4");
                group.appendChild(line);
            }
        }

        function clearAlignmentGuides() {
            const group = document.getElementById('guides-group');
            if (group) group.innerHTML = '';
        }

        function exportPNG() {
            clearSelections();
            clearAlignmentGuides();
            
            const editables = document.querySelectorAll('[contenteditable="true"]');
            editables.forEach(el => el.setAttribute('contenteditable', 'false'));

            const wrapper = document.getElementById('diagram-wrapper');
            const scrollContainer = document.getElementById('scroll-container');
            
            const originalScrollLeft = scrollContainer.scrollLeft;
            const originalScrollTop = scrollContainer.scrollTop;

            html2canvas(wrapper, {
                backgroundColor: '#ffffff',
                scale: 2,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'swimlane-diagram.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                scrollContainer.scrollLeft = originalScrollLeft;
                scrollContainer.scrollTop = originalScrollTop;

                editables.forEach(el => el.setAttribute('contenteditable', 'true'));
            }).catch(() => {
                editables.forEach(el => el.setAttribute('contenteditable', 'true'));
            });
        }
    </script>
